name: Build All

# Builds every dockerfile in the repo as a matrix in parallel. 
# Only builds images changed in the commit, but can be triggered manually to build all images.

on:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-all
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Docker contexts
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # list all directories that contain a Dockerfile
          mapfile -t all_dirs < <(find . -type f -name Dockerfile -print0 | xargs -0 -n1 dirname | sed 's|^\./||' | sort -u)

          # helper to produce image names from Dockerfile folders
          make_entry() {
            ctx="$1"
            if [ "$ctx" = '.' ] || [ -z "$ctx" ]; then
              img="root"
            else
              img=$(basename "$ctx")
            fi
            printf '{"context":"%s","image":"%s"}' "$ctx" "$img"
          }

          selected_dirs=()

          event_name="${EVENT_NAME}"

          if [ "$event_name" = "workflow_dispatch" ] || [ "$event_name" = "workflow_call" ]; then
            # manual run: rebuild everything
            selected_dirs=("${all_dirs[@]}")
          else
            # on push: build only Dockerfile folders touched by the change
            before="${BEFORE:-}"
            sha="${SHA:-}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              # no prior ref: treat as initial push -> build everything
              selected_dirs=("${all_dirs[@]}")
            else
              mapfile -t changed < <(git diff --name-only --diff-filter=AM "$before" "$sha" || true)
              for d in "${all_dirs[@]}"; do
                for f in "${changed[@]}"; do
                  nf="${f#./}"
                  if [[ "$nf" == "$d/"* ]] || [[ "$nf" == "$d/Dockerfile" ]] || [[ "$nf" == "$d" ]]; then
                    selected_dirs+=("$d")
                    break
                  fi
                done
              done

              # if nothing Docker-related changed, rebuild everything
              if [ ${#selected_dirs[@]} -eq 0 ]; then
                selected_dirs=("${all_dirs[@]}")
              fi
            fi
          fi

          # dedupe and build a real matrix axis so GitHub Actions accepts it
          mapfile -t unique_dirs < <(printf "%s\n" "${selected_dirs[@]}" | sort -u)
          if [ ${#unique_dirs[@]} -eq 0 ]; then
            echo "No Docker contexts to build."
            exit 1
          fi

          matrix_json=$(ruby -e '
            require "json"
            dirs = ARGV
            matrix = {
              "context" => dirs,
              "include" => dirs.map do |ctx|
                img = (ctx == "." || ctx.empty?) ? "root" : File.basename(ctx)
                { "context" => ctx, "image" => img }
              end,
            }
            puts JSON.generate(matrix)
          ' "${unique_dirs[@]}")
          echo "matrix=${matrix_json}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.image }}-${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ matrix.image }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
